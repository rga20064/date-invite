<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Физика — подготовка к ОГЭ/ЕГЭ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    text-align: center;
    padding: 30px 0 20px;
  }
  .header h1 {
    font-size: 26px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .header p {
    color: #94a3b8;
    font-size: 14px;
  }
  .menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    border: 1px solid #334155;
  }
  .card:active {
    transform: scale(0.98);
    background: #273449;
  }
  .card .icon {
    font-size: 28px;
    width: 45px;
    text-align: center;
  }
  .card .text h3 {
    font-size: 16px;
    margin-bottom: 3px;
  }
  .card .text p {
    font-size: 12px;
    color: #94a3b8;
  }
  .footer {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>
<body>

  <div class="header">
    <h1>⚛️ Физика</h1>
    <p>Подготовка к ОГЭ и ЕГЭ</p>
  </div>

  <div class="menu">
    <div class="card" onclick="openSection('theory')">
      <div class="icon">📘</div>
      <div class="text">
        <h3>Справочные материалы</h3>
        <p>Формулы, законы, конспекты</p>
      </div>
    </div>

    <div class="card" onclick="openSection('tests')">
      <div class="icon">✅</div>
      <div class="text">
        <h3>Тесты</h3>
        <p>Проверь себя по темам</p>
      </div>
    </div>

    <div class="card" onclick="openSection('homework')">
      <div class="icon">📝</div>
      <div class="text">
        <h3>Домашняя работа</h3>
        <p>Задания и дедлайны</p>
      </div>
    </div>

    <div class="card" onclick="openSection('tips')">
      <div class="icon">💡</div>
      <div class="text">
        <h3>Советы</h3>
        <p>Как сдать экзамен на максимум</p>
      </div>
    </div>

    <div class="card" onclick="writeTutor()">
      <div class="icon">✉️</div>
      <div class="text">
        <h3>Написать репетитору</h3>
        <p>Вопросы и обратная связь</p>
      </div>
    </div>
  </div>

  <div class="footer">
    © Ваш репетитор по физике
  </div>

<script>
  // Инициализация Telegram Mini App
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    // Показываем имя ученика, если открыто в Telegram
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.querySelector('.header p').textContent =
        `Привет, ${user.first_name}! Готовимся к экзамену`;
    }
  }

  function openSection(section) {
    // Пока просто уведомление. Сюда потом вставим переходы на разделы.
    if (tg) {
      tg.showAlert('Раздел в разработке: ' + section);
    } else {
      alert('Раздел в разработке: ' + section);
    }
  }

  function writeTutor() {
    // Замените username на свой
    const username = 'your_username';
    if (tg) {
      tg.openTelegramLink('https://t.me/' + username);
    } else {
      window.open('https://t.me/' + username, '_blank');
    }
  }
</script>

</body>
</html>
