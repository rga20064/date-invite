<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

    html, body {
      height: 100%;
      background: #08080b;
      color: #e8e6e1;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
    }

    /* ===== Сцены ===== */
    .scene {
      position: fixed; inset: 0;
      opacity: 0; pointer-events: none;
      transition: opacity 0.6s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .scene.active { opacity: 1; pointer-events: auto; }

    /* ===== Экран 0: Темнота ===== */
    .dark-overlay {
      position: absolute; inset: 0;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { background: #000; }
      50% { background: #0a0a0d; }
    }
    .whisper {
      font-size: 14px;
      color: #3a3a42;
      letter-spacing: 3px;
      text-transform: lowercase;
      font-style: italic;
      animation: fadeWhisper 3s ease-in-out infinite;
    }
    @keyframes fadeWhisper {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }

    /* ===== Экран 1: Комната ===== */
    .room {
      position: relative;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 40%, #2a1f1a 0%, #0d0a09 60%, #050505 100%);
    }

    .window {
      position: absolute;
      top: 12%; left: 50%;
      transform: translateX(-50%);
      width: 42%; height: 34%;
      background: linear-gradient(180deg, #1a2035 0%, #0a0d18 100%);
      border: 3px solid #1a1512;
      box-shadow: inset 0 0 40px rgba(80,100,180,0.15);
    }
    .window::before, .window::after {
      content: ''; position: absolute; background: #1a1512;
    }
    .window::before { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
    .window::after  { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }

    .lamp {
      position: absolute;
      top: 55%; left: 18%;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ffb86b;
      box-shadow: 0 0 60px 20px rgba(255,184,107,0.25);
      animation: flicker 3s ease-in-out infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.9; }
      45% { opacity: 1; }
      50% { opacity: 0.7; }
      55% { opacity: 1; }
    }

    .table {
      position: absolute;
      bottom: 18%; left: 50%;
      transform: translateX(-50%);
      width: 70%; height: 4px;
      background: #241a14;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    /* Предметы */
    .item {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s;
      filter: brightness(0.85);
    }
    .item::after {
      content: '';
      position: absolute; inset: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,184,107,0.2), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .item:hover::after, .item:active::after { opacity: 1; }
    .item:active { transform: scale(0.92); }

    .item::before {
      font-size: 32px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
    }

    .ticket { bottom: 22%; left: 28%; }
    .ticket::before { content: '🎫'; }

    .cup { bottom: 22%; left: 42%; }
    .cup::before { content: '☕'; }

    .key { bottom: 22%; left: 56%; }
    .key::before { content: '🔑'; }

    .vinyl { bottom: 22%; left: 70%; }
    .vinyl::before { content: '💿'; }

    .door {
      top: 45%; right: 6%;
      width: 14%; height: 40%;
      background: linear-gradient(180deg, #2a1d16, #1a1008);
      border: 2px solid #3a2519;
      border-radius: 2px;
    }
    .door::before {
      content: '';
      position: absolute;
      right: 8px; top: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #8a6a3a;
      box-shadow: 0 0 8px rgba(255,184,107,0.5);
    }
    .door:hover { filter: brightness(1.3); }

    .hint {
      position: absolute;
      bottom: 8%; left: 0; right: 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 2px;
      color: #4a4a52;
      font-style: italic;
      animation: fadeWhisper 3s infinite;
    }

    /* ===== Экран 2: Записка ===== */
    .note {
      background: #12100e;
      border: 1px solid #2a221c;
      border-radius: 4px;
      padding: 40px 28px;
      max-width: 380px;
      width: 88%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
      animation: unfold 0.5s ease;
    }
    @keyframes unfold {
      from { opacity: 0; transform: scale(0.94) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .note-icon {
      font-size: 42px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 20px rgba(255,184,107,0.4));
    }
    .note h2 {
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: lowercase;
      color: #ffb86b;
      margin-bottom: 20px;
      font-weight: normal;
    }
    .note p {
      font-size: 16px;
      line-height: 1.7;
      color: #c9c3ba;
      font-style: italic;
      margin-bottom: 30px;
    }
    .btn-back {
      background: transparent;
      border: 1px solid #3a3028;
      color: #8a8078;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.3s;
    }
    .btn-back:hover { border-color: #ffb86b; color: #ffb86b; }

    /* ===== Экран 3: Финал ===== */
    .final-card {
      max-width: 400px;
      width: 88%;
      padding: 40px 28px;
      text-align: center;
      animation: unfold 0.7s ease;
    }
    .final-line {
      width: 40px; height: 1px;
      background: #ffb86b;
      margin: 0 auto 30px;
      box-shadow: 0 0 20px rgba(255,184,107,0.6);
    }
    .final-card h1 {
      font-size: 22px;
      font-weight: normal;
      font-style: italic;
      letter-spacing: 1px;
      color: #e8e6e1;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .final-card p {
      color: #8a8078;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 30px;
      font-style: italic;
    }
    .details {
      display: grid; gap: 10px; margin-bottom: 22px;
    }
    .details input {
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a221c;
      padding: 12px 4px;
      font-size: 15px;
      color: #e8e6e1;
      font-family: inherit;
      text-align: center;
      transition: border-color 0.3s;
      width: 100%;
    }
    .details input:focus {
      outline: none;
      border-color: #ffb86b;
    }
    .details input::placeholder { color: #4a4a52; font-style: italic; }

    .btn-send {
      background: transparent;
      border: 1px solid #ffb86b;
      color: #ffb86b;
      padding: 14px 26px;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: lowercase;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.3s;
      width: 100%;
    }
    .btn-send:active {
      background: #ffb86b;
      color: #08080b;
    }
    .tiny {
      font-size: 12px;
      color: #4a4a52;
      font-style: italic;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <!-- Экран 0: Темнота -->
  <section class="scene active" data-scene="dark">
    <div class="dark-overlay" id="darkOverlay">
      <p class="whisper">нажми, чтобы включить свет</p>
    </div>
  </section>

  <!-- Экран 1: Комната -->
  <section class="scene" data-scene="room">
    <div class="room" id="room">
      <div class="window"></div>
      <div class="lamp"></div>
      <div class="table"></div>

      <button class="item ticket" data-item="ticket" title="билет"></button>
      <button class="item cup"    data-item="cup"    title="кофе"></button>
      <button class="item key"    data-item="key"    title="ключ"></button>
      <button class="item vinyl"  data-item="vinyl"  title="пластинка"></button>
      <button class="item door"   data-item="door"   title="дверь"></button>

      <p class="hint">Осмотрись...</p>
    </div>
  </section>

  <!-- Экран 2: Записка -->
  <section class="scene" data-scene="note">
    <div class="note">
      <div class="note-icon" id="noteIcon"></div>
      <h2 id="noteTitle"></h2>
      <p id="noteText"></p>
      <button class="btn-back" id="closeNote">← вернуться</button>
    </div>
  </section>

  <!-- Экран 3: Финал -->
  <section class="scene" data-scene="final">
    <div class="final-card" id="finalCard">
      <div class="final-line"></div>
      <h1 id="finalTitle">Хорошо. Дверь открыта.</h1>
      <p id="finalText">За ней — вечер, который я придумал специально для тебя. Выбери день, я подстроюсь.</p>

      <div class="details">
        <input type="date" id="dateInput">
        <input type="time" id="timeInput" value="19:00">
        <button class="btn-send" id="sendBtn">Оставить ответ →</button>
      </div>
      <p class="tiny">не переживай, всё уже придумано</p>
    </div>
  </section>

  <script>
    // ===== Telegram =====
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.disableVerticalSwipes?.();
      tg.setHeaderColor?.('#08080b');
      tg.setBackgroundColor?.('#08080b');
    }

    function haptic(type = 'light') {
      tg?.HapticFeedback?.impactOccurred(type);
    }

    // ===== Сцены =====
    const scenes = document.querySelectorAll('.scene');
    let current = 0;

    function goTo(index) {
      scenes[current].classList.remove('active');
      scenes[index].classList.add('active');
      current = index;
    }

    // ===== Экран 0 → 1 =====
    document.getElementById('darkOverlay').addEventListener('click', () => {
      haptic('medium');
      goTo(1);
    });

    // ===== Записки =====
    const NOTES = {
      ticket: {
        icon: '🎫',
        title: 'билет',
        text: 'Два билета. Один — для тебя. Второй я оставлю себе, чтобы не искать компанию.'
      },
      cup: {
        icon: '☕',
        title: 'чашка',
        text: 'Ещё тёплая. Я знаю одно место, где варят такой же — и там никто не торопит.'
      },
      key: {
        icon: '🔑',
        title: 'ключ',
        text: 'Пока не скажу от чего. Но если согласишься — узнаешь по дороге.'
      },
      vinyl: {
        icon: '💿',
        title: 'пластинка',
        text: 'Ставлю её, когда думаю о тебе. Одну и ту же. Уже неделю.'
      }
    };

    const noteIcon  = document.getElementById('noteIcon');
    const noteTitle = document.getElementById('noteTitle');
    const noteText  = document.getElementById('noteText');
    const closeNote = document.getElementById('closeNote');

    const openedItems = new Set();

    document.querySelectorAll('.item').forEach(item => {
      item.addEventListener('click', () => {
        const key = item.dataset.item;
        haptic('light');

        if (key === 'door') {
          if (openedItems.size < Object.keys(NOTES).length) {
            const left = Object.keys(NOTES).length - openedItems.size;
            showNote('🔒', 'дверь заперта',
              `Найди ещё ${left} ${plural(left,'предмет','предмета','предметов')}. Что-то здесь важное...`);
            return;
          }
          goTo(3);
          return;
        }

        openedItems.add(key);
        const note = NOTES[key];
        showNote(note.icon, note.title, note.text);
      });
    });

    function showNote(icon, title, text) {
      noteIcon.textContent = icon;
      noteTitle.textContent = title;
      noteText.textContent = text;
      goTo(2);
    }

    closeNote.addEventListener('click', () => {
      haptic('light');
      goTo(1);
    });

    function plural(n, one, few, many) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return one;
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
      return many;
    }

    // ===== Дата по умолчанию — ближайшая пятница =====
    const dateInput = document.getElementById('dateInput');
    const today = new Date();
    const dayOfWeek = today.getDay();
    const daysUntilFriday = (5 - dayOfWeek + 7) % 7 || 7;
    const nextFriday = new Date(today);
    nextFriday.setDate(today.getDate() + daysUntilFriday);
    dateInput.value = nextFriday.toISOString().split('T')[0];

    // ===== Отправка =====
    document.getElementById('sendBtn').addEventListener('click', () => {
      const date = dateInput.value;
      const time = document.getElementById('timeInput').value;

      if (!date) {
        haptic('rigid');
        tg?.showAlert ? tg.showAlert('Выбери дату') : alert('Выбери дату');
        return;
      }

      const payload = { date, time, found: [...openedItems] };
      haptic('heavy');

      if (tg) {
        try { tg.sendData(JSON.stringify(payload)); } catch (e) {}
      }

      document.getElementById('finalCard').innerHTML = `
        <div class="final-line"></div>
        <h1>Договорились.</h1>
        <p style="font-size:15px;">${date} в ${time}<br><br>детали пришлю ближе к делу.</p>
      `;
    });
  </script>
</body>
</html>
